[package]
name = "sb3-decoder"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = { version = "3.5.1", optional = true }
image = { version = "0.25.10", optional = true }
nanomp3 = { version = "0.2.0", optional = true }
resvg = { version = "0.48.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.3"
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = "9.0.5"

[features]
default = ["costumes", "sounds"]
costumes = ["dep:image", "dep:resvg"]
sounds = ["dep:hound", "dep:nanomp3"]

[dev-dependencies]
insta = "1.49.0"
